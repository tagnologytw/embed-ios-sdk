name: iOS SDK CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build, and SPM
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Swift package
        run: swift package dump-package

      - name: Run tests with Mac Catalyst
        if: github.event_name == 'pull_request'
        run: >-
          xcodebuild test
          -scheme EmbedIOSSDK
          -destination 'platform=macOS,variant=Mac Catalyst'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKCatalystTests"
          CODE_SIGNING_ALLOWED=NO

      # On some runner VMs xcodebuild does not list the installed simulators even
      # though simctl does. Pick an iPhone from simctl whose runtime matches the
      # active Xcode SDK, boot it, and hand its id to xcodebuild.
      - name: Boot iOS simulator
        id: simulator
        if: github.event_name != 'pull_request'
        run: |
          sdk_major=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          echo "iOS Simulator SDK major version: $sdk_major"
          devices=$(xcrun simctl list devices available --json)
          pick() {
            echo "$devices" | jq -r --arg major "$sdk_major" --arg name "$1" '
              [.devices | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-" + $major + "-"))
                | .key as $runtime | .value[]
                | select(.name | startswith($name))
                | {udid, name, runtime: $runtime}]
              | sort_by(.runtime) | last // empty | "\(.udid) \(.name) \(.runtime)"'
          }
          selected=$(pick "iPhone 16 Pro")
          [ -z "$selected" ] && selected=$(pick "iPhone")
          if [ -z "$selected" ]; then
            echo "::error::No iPhone simulator for iOS $sdk_major"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $selected"
          udid=${selected%% *}
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "id=$udid" >> "$GITHUB_OUTPUT"

      - name: Run iOS integration tests
        if: github.event_name != 'pull_request'
        run: >-
          xcodebuild test
          -scheme EmbedIOSSDK
          -destination 'id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKTests"
          CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS devices
        run: >-
          xcodebuild build
          -scheme EmbedIOSSDK
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKDeviceBuild"
          CODE_SIGNING_ALLOWED=NO

  cocoapods:
    name: CocoaPods lint
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install CocoaPods when unavailable
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Validate podspec
        run: pod lib lint EmbedIOSSDK.podspec --allow-warnings
