name: iOS SDK CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build, and SPM
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Swift package
        run: swift package dump-package

      - name: Run tests with Mac Catalyst
        if: github.event_name == 'pull_request'
        run: >-
          xcodebuild test
          -scheme EmbedIOSSDK
          -destination 'platform=macOS,variant=Mac Catalyst'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKCatalystTests"
          CODE_SIGNING_ALLOWED=NO

      # Runner VMs occasionally boot before CoreSimulator has loaded its devices,
      # so pick an available iPhone at runtime and retry instead of hard-coding one.
      - name: Select iOS simulator
        id: simulator
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3; do
            destinations=$(xcodebuild -showdestinations -scheme EmbedIOSSDK 2>/dev/null \
              | grep 'platform:iOS Simulator' | grep 'name:iPhone' | grep -v placeholder || true)
            line=$(echo "$destinations" | grep 'name:iPhone 16 Pro }' | head -1)
            [ -z "$line" ] && line=$(echo "$destinations" | head -1)
            if [ -n "$line" ]; then
              echo "Using simulator: $line"
              echo "id=$(echo "$line" | sed -E 's/.*id:([^,]+),.*/\1/')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No iPhone simulator available (attempt $attempt), restarting CoreSimulator..."
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            xcrun simctl list devices > /dev/null 2>&1 || true
            sleep 20
          done
          echo "::error::No iPhone simulator available after 3 attempts"
          xcrun simctl list devices
          exit 1

      - name: Run iOS integration tests
        if: github.event_name != 'pull_request'
        run: >-
          xcodebuild test
          -scheme EmbedIOSSDK
          -destination 'id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKTests"
          CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS devices
        run: >-
          xcodebuild build
          -scheme EmbedIOSSDK
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/EmbedIOSSDKDeviceBuild"
          CODE_SIGNING_ALLOWED=NO

  cocoapods:
    name: CocoaPods lint
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install CocoaPods when unavailable
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Validate podspec
        run: pod lib lint EmbedIOSSDK.podspec --allow-warnings
